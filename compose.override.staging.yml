x-restart-policy: &restart_policy
  restart: unless-stopped

services:
  redis:
    ports:
      - '6379:6379'
  postgres:
    ports:
      - '5432:5432'
  https-portal:
    <<: *restart_policy
    image: steveltn/https-portal:1
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINS: 'stg.sentry.cloudnativedays.jp -> http://nginx:80'
      STAGE: 'production' # Don't use production until staging works
    volumes:
      - https-portal-data:/var/lib/https-portal
    depends_on:
      - nginx
  kafka-exporter:
    <<: *restart_policy
    image: danielqsj/kafka-exporter:v1.7.0
    restart: always
    ports:
      - 9308:9308
    healthcheck:
      <<: *healthcheck_defaults
      test: [ "CMD-SHELL", "nc -z localhost 9308" ]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  https-portal-data:
