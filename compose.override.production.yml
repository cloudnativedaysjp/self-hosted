x-restart-policy: &restart_policy
  restart: unless-stopped
x-healthcheck-defaults: &healthcheck_defaults
  # Avoid setting the interval too small, as docker uses much more CPU than one would expect.
  # Related issues:
  # https://github.com/moby/moby/issues/39102
  # https://github.com/moby/moby/issues/39388
  # https://github.com/getsentry/self-hosted/issues/1000
  interval: "$HEALTHCHECK_INTERVAL"
  timeout: "$HEALTHCHECK_TIMEOUT"
  retries: $HEALTHCHECK_RETRIES
  start_period: 10s

services:
  redis:
    ports:
      - '6379:6379'
  postgres:
    ports:
      - '5432:5432'
  https-portal:
    <<: *restart_policy
    image: steveltn/https-portal:1
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINS: 'sentry.cloudnativedays.jp -> http://nginx:80'
      STAGE: 'production' # Don't use production until staging works
    volumes:
      - https-portal-data:/var/lib/https-portal
    depends_on:
      - nginx
  kafka-exporter:
    <<: *restart_policy
    image: danielqsj/kafka-exporter:v1.7.0
    restart: always
    ports:
      - 9308:9308
    healthcheck:
      <<: *healthcheck_defaults
      test: [ "CMD-SHELL", "nc -z localhost 9308" ]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  https-portal-data:
